<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sorteador de números</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f3f0e8;--panel:#fffdf8;--ink:#1d2433;--muted:#5d6577;--line:#d9d3c4;--accent:#2f5bea;--accent-ink:#fff;--err:#b3261e;
  --b1:#e8453c;--b2:#f2b705;--b3:#1f9d6b;--b4:#2f5bea;--b5:#8a4fd1;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121620;--panel:#1b2130;--ink:#eef0f6;--muted:#9aa3b8;--line:#2e3649;--accent:#7c9bff;--accent-ink:#0f1422;--err:#ff8a80}}
:root[data-theme="dark"]{--bg:#121620;--panel:#1b2130;--ink:#eef0f6;--muted:#9aa3b8;--line:#2e3649;--accent:#7c9bff;--accent-ink:#0f1422;--err:#ff8a80}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Bricolage Grotesque",system-ui,-apple-system,"Segoe UI",sans-serif;line-height:1.5}
.wrap{max-width:1000px;margin:0 auto;padding:clamp(16px,4vw,48px)}
h1{font-size:clamp(2rem,6vw,3.6rem);line-height:1.05;margin:0 0 .4rem;font-weight:800;letter-spacing:-.02em}
.lead{margin:0 0 2rem;color:var(--muted);max-width:52ch}
.grid{display:grid;gap:20px;grid-template-columns:minmax(0,5fr) minmax(0,7fr)}
@media (max-width:760px){.grid{grid-template-columns:1fr}}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:clamp(16px,3vw,28px)}
.field{margin-bottom:18px}
label{display:block;font-weight:600;margin-bottom:6px}
input[type=number]{width:100%;font:inherit;font-size:1.1rem;padding:12px 14px;border:1.5px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink)}
input[type=number]:focus-visible,button:focus-visible,.check:focus-within{outline:3px solid var(--accent);outline-offset:2px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.check{display:flex;gap:12px;align-items:center;padding:12px 14px;border:1.5px solid var(--line);border-radius:10px;margin-bottom:10px;cursor:pointer;font-weight:400}
.check input{width:20px;height:20px;accent-color:var(--accent);margin:0}
.hint{font-size:.9rem;color:var(--muted);margin:0 0 16px;min-height:1.4em}
.hint.err{color:var(--err);font-weight:600}
button.go{width:100%;font:inherit;font-weight:800;font-size:1.15rem;padding:14px;border:0;border-radius:12px;background:var(--accent);color:var(--accent-ink);cursor:pointer}
button.go:disabled{opacity:.45;cursor:not-allowed}
button.go:active:not(:disabled){transform:translateY(1px)}
.result{min-height:260px;display:flex;flex-direction:column}
.result h2{margin:0 0 14px;font-size:1.1rem}
.balls{display:flex;flex-wrap:wrap;gap:12px;align-content:flex-start;flex:1;list-style:none;margin:0;padding:0}
.ball{--c:var(--b1);min-width:clamp(56px,12vw,76px);height:clamp(56px,12vw,76px);padding:0 10px;border-radius:999px;display:grid;place-items:center;font-weight:800;font-size:clamp(1.1rem,3.4vw,1.6rem);color:#fff;
  background:radial-gradient(circle at 32% 28%,rgba(255,255,255,.55) 0 14%,transparent 15%),var(--c);box-shadow:inset 0 -6px 0 rgba(0,0,0,.18);animation:pop .35s both cubic-bezier(.3,1.5,.5,1);animation-delay:calc(var(--i)*60ms)}
.ball:nth-child(5n+2){--c:var(--b2);color:#2a2100}
.ball:nth-child(5n+3){--c:var(--b3)}
.ball:nth-child(5n+4){--c:var(--b4)}
.ball:nth-child(5n+5){--c:var(--b5)}
@keyframes pop{from{transform:scale(.2) translateY(14px);opacity:0}to{transform:none;opacity:1}}
.empty{color:var(--muted);margin:auto;text-align:center;max-width:30ch}
.tools{display:flex;gap:10px;margin-top:16px;flex-wrap:wrap}
.tools button{font:inherit;padding:8px 14px;border:1.5px solid var(--line);border-radius:999px;background:transparent;color:var(--ink);cursor:pointer}
.tools button:hover{border-color:var(--accent)}
.hist{margin-top:20px;font-size:.95rem;color:var(--muted)}
.hist ol{margin:6px 0 0;padding-left:1.2em}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@media (prefers-reduced-motion:reduce){.ball{animation:none}}
</style>
</head>
<body>
<main class="wrap">
  <h1>Sorteador de números</h1>
  <p class="lead">Escolha quantos números sortear e em qual intervalo. O resultado aparece assim que você sortear.</p>

  <div class="grid">
    <section class="panel" aria-label="Configurações">
      <div class="field">
        <label for="qty">Quantidade de números</label>
        <input id="qty" type="number" min="1" max="1000" value="6" inputmode="numeric">
      </div>
      <div class="field row">
        <div>
          <label for="min">Mínimo</label>
          <input id="min" type="number" value="1" inputmode="numeric">
        </div>
        <div>
          <label for="max">Máximo</label>
          <input id="max" type="number" value="60" inputmode="numeric">
        </div>
      </div>
      <label class="check"><input id="uniq" type="checkbox" checked> Não repetir números</label>
      <label class="check"><input id="sort" type="checkbox"> Mostrar em ordem crescente</label>
      <p id="hint" class="hint" role="status" aria-live="polite"></p>
      <button id="go" class="go" type="button">Sortear</button>
    </section>

    <section class="panel result" aria-label="Resultado">
      <h2 id="title">Resultado</h2>
      <ul id="balls" class="balls" aria-live="polite"><li class="empty">Nenhum sorteio ainda. Ajuste as opções e clique em Sortear.</li></ul>
      <div class="tools" id="tools" hidden>
        <button id="copy" type="button">Copiar números</button>
        <button id="again" type="button">Sortear de novo</button>
      </div>
      <div class="hist" id="hist" hidden><strong>Sorteios anteriores</strong><ol id="histList"></ol></div>
    </section>
  </div>
</main>

<script>
(function(){
  var $=function(id){return document.getElementById(id)};
  var qty=$('qty'),min=$('min'),max=$('max'),uniq=$('uniq'),sort=$('sort'),hint=$('hint'),go=$('go'),balls=$('balls');
  var tools=$('tools'),hist=$('hist'),histList=$('histList'),title=$('title');
  var current=[],history=[];

  function read(){
    return {q:parseInt(qty.value,10),a:parseInt(min.value,10),b:parseInt(max.value,10)};
  }
  function validate(){
    var v=read(),msg='';
    if([v.q,v.a,v.b].some(isNaN)) msg='Preencha todos os campos com números inteiros.';
    else if(v.q<1||v.q>1000) msg='A quantidade deve estar entre 1 e 1000.';
    else if(v.a>v.b) msg='O mínimo não pode ser maior que o máximo.';
    else if(uniq.checked && v.q>v.b-v.a+1) msg='Sem repetição, o intervalo tem só '+(v.b-v.a+1)+' números possíveis. Reduza a quantidade ou amplie o intervalo.';
    hint.className='hint'+(msg?' err':'');
    if(msg){hint.textContent=msg;go.disabled=true;return null}
    hint.textContent='Intervalo com '+(v.b-v.a+1).toLocaleString('pt-BR')+' números possíveis.';
    go.disabled=false;return v;
  }
  function rnd(n){ // inteiro uniforme em [0, n)
    var buf=new Uint32Array(1),lim=Math.floor(4294967296/n)*n,x;
    do{crypto.getRandomValues(buf);x=buf[0]}while(x>=lim);
    return x%n;
  }
  function draw(v){
    var size=v.b-v.a+1,out=[],i;
    if(uniq.checked){
      var seen=new Map(); // Fisher-Yates parcial sem criar o intervalo inteiro
      for(i=0;i<v.q;i++){
        var j=i+rnd(size-i);
        var vi=seen.has(i)?seen.get(i):i, vj=seen.has(j)?seen.get(j):j;
        seen.set(j,vi);seen.set(i,vj);
        out.push(v.a+vj);
      }
    }else{
      for(i=0;i<v.q;i++) out.push(v.a+rnd(size));
    }
    if(sort.checked) out.sort(function(x,y){return x-y});
    return out;
  }
  function render(nums){
    balls.innerHTML='';
    nums.forEach(function(n,i){
      var li=document.createElement('li');
      li.className='ball';li.style.setProperty('--i',Math.min(i,30));
      li.textContent=n;balls.appendChild(li);
    });
    title.textContent='Resultado: '+nums.length+(nums.length===1?' número':' números');
    tools.hidden=false;
  }
  function run(){
    var v=validate();if(!v)return;
    current=draw(v);render(current);
    history.unshift(current.slice(0,12).join(', ')+(current.length>12?'…':''));
    history=history.slice(0,5);
    histList.innerHTML='';
    history.slice(1).forEach(function(h){var li=document.createElement('li');li.textContent=h;histList.appendChild(li)});
    hist.hidden=history.length<2;
  }
  [qty,min,max,uniq].forEach(function(el){el.addEventListener('input',validate);el.addEventListener('change',validate)});
  sort.addEventListener('change',function(){
    if(!current.length)return;
    current=sort.checked?current.slice().sort(function(x,y){return x-y}):current;render(current);
  });
  go.addEventListener('click',run);
  $('again').addEventListener('click',run);
  $('copy').addEventListener('click',function(){
    var t=current.join(', '),btn=$('copy');
    function ok(){btn.textContent='Copiado!';setTimeout(function(){btn.textContent='Copiar números'},1500)}
    try{navigator.clipboard.writeText(t).then(ok,function(){btn.textContent='Não foi possível copiar'})}
    catch(e){btn.textContent='Não foi possível copiar'}
  });
  [qty,min,max].forEach(function(el){el.addEventListener('keydown',function(e){if(e.key==='Enter')run()})});
  validate();
})();
</script>
</body>
</html>
